<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#2463eb">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description"
    content="Dr. Ray 已確認駐診日期、時間及地點。所有時間均為香港時間。">

  <title>Dr. Ray｜駐診時間及地點</title>

  <style>
    :root {
      --bg: #f3f6fb;
      --card: #fff;
      --text: #172337;
      --muted: #637087;
      --line: #dce3ed;
      --blue: #2463eb;

      --alan-color: #7650bd;
      --alan-bg: #f3edfc;

      --tqb-color: #007d63;
      --tqb-bg: #e5f5ee;

      --cwb-color: #245dbe;
      --cwb-bg: #eaf1ff;

      --stubbs-color: #a95b00;
      --stubbs-bg: #fff2df;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: system-ui, -apple-system,
        "Noto Sans TC", sans-serif;
      line-height: 1.6;
      -webkit-text-size-adjust: 100%;
    }

    main {
      max-width: 1240px;
      margin: auto;
      padding: 24px 18px 40px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.35;
    }

    h2 {
      margin: 0;
      font-size: 20px;
    }

    p {
      margin: 8px 0;
    }

    button,
    input {
      font: inherit;
      min-height: 44px;
      max-width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text);
      background: white;
    }

    button {
      cursor: pointer;
      touch-action: manipulation;
    }

    button:disabled {
      opacity: .45;
      cursor: default;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid #2463eb66;
      outline-offset: 3px;
    }

    [hidden] {
      display: none !important;
    }

    .muted {
      color: var(--muted);
    }

    .header {
      margin-bottom: 20px;
    }

    .eyebrow {
      margin-bottom: 5px;
      color: var(--blue);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    .card {
      min-width: 0;
      margin-top: 16px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
    }

    .month-nav {
      display: grid;
      grid-template-columns: 44px minmax(150px, 200px) 44px;
      align-items: center;
      gap: 8px;
    }

    .month-nav button {
      padding: 8px;
      font-size: 20px;
    }

    .month-nav input {
      min-width: 0;
      width: 100%;
      text-align: center;
    }

    .actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .view-switch {
      display: flex;
      gap: 6px;
    }

    .view-switch button[aria-pressed="true"] {
      color: var(--blue);
      border-color: #abc2fb;
      background: #edf3ff;
      font-weight: 700;
    }

    .locations-heading {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px 16px;
    }

    .locations-heading p {
      margin: 0;
      font-size: 13px;
    }

    .location-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .alan {
      --place-color: var(--alan-color);
      --place-bg: var(--alan-bg);
    }

    .tqb {
      --place-color: var(--tqb-color);
      --place-bg: var(--tqb-bg);
    }

    .cwb {
      --place-color: var(--cwb-color);
      --place-bg: var(--cwb-bg);
    }

    .stubbs {
      --place-color: var(--stubbs-color);
      --place-bg: var(--stubbs-bg);
    }

    .location-card {
      display: block;
      width: 100%;
      min-width: 0;
      height: 100%;
      padding: 16px;
      border: 1px solid var(--place-color);
      border-left: 5px solid var(--place-color);
      border-radius: 12px;
      color: var(--text);
      background: var(--place-bg);
      text-align: left;
      transition:
        opacity .15s ease,
        background-color .15s ease,
        box-shadow .15s ease;
    }

    .location-card:hover {
      box-shadow: 0 3px 12px #17233712;
    }

    .location-card[aria-pressed="false"] {
      opacity: .5;
      background: #f5f6f8;
      border-color: #cbd2dd;
      border-left-color: var(--place-color);
    }

    .location-card[aria-pressed="false"]:hover {
      opacity: .75;
    }

    .location-card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .location-name {
      display: block;
      font-size: 16px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .selection-mark {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 23px;
      width: 23px;
      height: 23px;
      margin-top: 2px;
      border: 2px solid var(--place-color);
      border-radius: 6px;
      color: white;
      background: var(--place-color);
      font-size: 15px;
      font-weight: 800;
      line-height: 1;
    }

    .location-card[aria-pressed="false"] .selection-mark {
      color: transparent;
      background: white;
      border-color: #919bac;
    }

    .location-address {
      display: block;
      margin-top: 8px;
      color: #465268;
      font-size: 14px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .location-state {
      display: block;
      margin-top: 10px;
      color: var(--place-color);
      font-size: 12px;
      font-weight: 650;
    }

    .control-card {
      margin-top: 16px;
    }

    #status {
      min-height: 24px;
      margin-top: 14px;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    #status.error {
      color: #b42318;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }

    #summary {
      color: var(--muted);
      font-size: 13px;
    }

    .calendar-hint {
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .calendar-scroll {
      overflow-x: auto;
      padding: 2px;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
    }

    .month-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
      min-width: 1050px;
    }

    .weekday {
      padding: 8px 2px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .day {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 260px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
    }

    .day.weekend {
      background: #fafbfe;
    }

    .day.past {
      color: #8c95a5;
      background: #f7f8fa;
    }

    .day.today {
      outline: 2px solid var(--blue);
      outline-offset: -2px;
    }

    .date-number {
      display: flex;
      align-items: center;
      flex: 0 0 auto;
      gap: 6px;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .today-label {
      color: var(--blue);
      font-size: 11px;
    }

    /*
      每日日期下方分成兩個等高區域。
      即使上午沒有更，下午的更仍然放在下半部。
    */
    .day-sessions {
      display: grid;
      grid-template-rows:
        minmax(100px, 1fr)
        minmax(100px, 1fr);
      flex: 1;
      min-height: 0;
    }

    .session-half {
      min-width: 0;
      padding: 6px 0;
    }

    .session-half.afternoon {
      border-top: 1px dashed #ccd5e2;
    }

    .event {
      min-width: 0;
      padding: 9px;
      border-left: 4px solid var(--place-color);
      border-radius: 8px;
      background: var(--place-bg);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .session-half .event + .event {
      margin-top: 7px;
    }

    .event strong {
      display: block;
      line-height: 1.6;
    }

    .event-time {
      margin-top: 5px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .agenda {
      display: grid;
      gap: 14px;
    }

    .agenda-day {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .agenda-day.today {
      border-color: #9db9fa;
      background: #fcfdff;
    }

    .agenda-date {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }

    .agenda-date strong {
      font-size: 18px;
    }

    .agenda-date span {
      color: var(--muted);
      font-size: 13px;
    }

    .agenda .event {
      padding: 14px;
      font-size: 15px;
    }

    .agenda .event + .event {
      margin-top: 10px;
    }

    .agenda-event-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
    }

    .agenda-event-head .event-time {
      flex: 0 0 auto;
      margin-top: 0;
    }

    .event-address {
      margin-top: 7px;
      color: #465268;
      font-size: 13px;
      line-height: 1.7;
    }

    .empty {
      margin-bottom: 14px;
      padding: 28px 16px;
      border-radius: 12px;
      color: var(--muted);
      background: #f6f8fc;
      text-align: center;
    }

    .notice {
      color: var(--muted);
      font-size: 13px;
    }

    .notice strong {
      color: var(--text);
    }

    footer {
      margin-top: 20px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 700px) {
      main {
        padding: 20px 12px 30px;
        padding-left: max(12px, env(safe-area-inset-left));
        padding-right: max(12px, env(safe-area-inset-right));
      }

      h1 {
        font-size: 25px;
      }

      .card {
        padding: 15px;
      }

      .location-grid {
        grid-template-columns: minmax(0, 1fr);
      }

      .location-card {
        padding: 14px;
      }

      .toolbar {
        display: block;
      }

      .month-nav {
        grid-template-columns: 44px minmax(0, 1fr) 44px;
        width: 100%;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        margin-top: 12px;
      }

      .view-switch {
        grid-column: 1 / -1;
        width: 100%;
      }

      .view-switch button {
        flex: 1;
      }

      .agenda-day {
        padding: 13px;
      }

      .agenda-event-head {
        display: block;
      }

      .agenda-event-head .event-time {
        margin-top: 6px;
      }
    }
  </style>
</head>

<body>
<main>
  <header class="header">
    <div class="eyebrow">CLINIC SCHEDULE</div>
    <h1>Dr. Ray 駐診時間</h1>
    <p class="muted">查看已確認的駐診安排及地點</p>
  </header>

  <!-- 地點方框同時作為多選篩選器 -->
  <section class="card" aria-labelledby="locationsTitle">
    <div class="locations-heading">
      <h2 id="locationsTitle">駐診地點及地址</h2>
      <p class="muted">點擊方框選取／取消選取，可同時選擇多個地點。</p>
    </div>

    <div id="locationCards"
      class="location-grid"
      role="group"
      aria-label="選擇要顯示的駐診地點"></div>
  </section>

  <section class="card control-card" aria-label="日曆控制">
    <div class="toolbar">
      <div class="month-nav">
        <button id="previous"
          type="button"
          aria-label="上一個月">←</button>

        <input id="month"
          type="month"
          aria-label="所選月份"
          required>

        <button id="next"
          type="button"
          aria-label="下一個月">→</button>
      </div>

      <div class="actions">
        <button id="thisMonth" type="button">本月</button>
        <button id="refresh" type="button">重新整理</button>

        <div class="view-switch"
          role="group"
          aria-label="顯示方式">
          <button id="monthView"
            type="button"
            aria-pressed="false">月曆</button>

          <button id="listView"
            type="button"
            aria-pressed="false">清單</button>
        </div>
      </div>
    </div>

    <p id="status"
      class="muted"
      role="status"
      aria-live="polite">
      正在載入駐診時間…
    </p>
  </section>

  <section id="schedule"
    class="card"
    aria-label="駐診時間"
    aria-busy="true">

    <div class="section-heading">
      <h2 id="monthTitle"></h2>
      <span id="summary" aria-live="polite"></span>
    </div>

    <div id="empty" class="empty" hidden></div>

    <p id="calendarHint" class="calendar-hint" hidden>
      每日上半部：13:00 前開始的更期；
      下半部：13:00 或之後開始的更期。
      月曆可左右滑動。
    </p>

    <div id="calendarWrap"
      class="calendar-scroll"
      hidden>
      <div id="calendar" class="month-grid"></div>
    </div>

    <div id="agenda" class="agenda" hidden></div>
  </section>

  <aside class="card notice">
    <p><strong>所有時間均為香港時間（UTC+8）。</strong></p>
    <p>
      本頁只列出今日起已確認的駐診安排，不代表尚有預約名額。
      如需預約或確認安排，請聯絡相關診所。
    </p>
    <p>
      未列出的日期不代表接受預約；
      駐診時間如有更改，以診所確認為準。
    </p>
  </aside>

  <footer>Dr. Ray · 公開駐診日曆</footer>
</main>

<script>
"use strict";

(() => {
  const API =
    "https://vuzzgyzyucyuedxabjss.supabase.co";

  const KEY =
    "sb_publishable_meYS5Q2OrY2T0pwrUE8lbQ__jjeEkTt";

  const $ = id => document.getElementById(id);

  const places = {
    alan: {
      name: "香港專科日間醫療中心",
      address: "九龍旺角彌敦道625及639號雅蘭中心一期20樓"
    },
    tqb: {
      name: "港安醫療中心－太古坊",
      address: "香港鰂魚涌英皇道979號太古坊濠豐大廈19樓"
    },
    cwb: {
      name: "港安醫療中心－銅鑼灣",
      address: "香港銅鑼灣恩平道28號利園二期26樓"
    },
    stubbs: {
      name: "香港港安醫院－司徒拔道",
      address: "香港灣仔區司徒拔道40號"
    }
  };

  // 預設選取全部地點；重新整理日程不會重設選擇。
  const selectedLocations = new Set(Object.keys(places));

  const weekdays = ["日", "一", "二", "三", "四", "五", "六"];

  const pad = value => String(value).padStart(2, "0");

  const esc = value => String(value ?? "").replace(
    /[&<>"']/g,
    char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]
  );

  function todayHK() {
    const parts = new Intl.DateTimeFormat("en-GB", {
      timeZone: "Asia/Hong_Kong",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).formatToParts(new Date());

    const fields = Object.fromEntries(
      parts.map(part => [part.type, part.value])
    );

    return `${fields.year}-${fields.month}-${fields.day}`;
  }

  function validMonth(value) {
    return typeof value === "string" &&
      /^[1-9]\d{3}-(0[1-9]|1[0-2])$/.test(value);
  }

  function validDate(value) {
    if (
      typeof value !== "string" ||
      !/^[1-9]\d{3}-\d{2}-\d{2}$/.test(value)
    ) {
      return false;
    }

    const date = new Date(value + "T00:00:00Z");

    return Number.isFinite(date.getTime()) &&
      date.toISOString().slice(0, 10) === value;
  }

  function validTime(value) {
    return typeof value === "string" &&
      /^([01]\d|2[0-3]):[0-5]\d$/.test(value);
  }

  let selectedMonth = todayHK().slice(0, 7);

  let view = window.matchMedia("(max-width: 700px)").matches
    ? "list"
    : "month";

  let events = [];
  let loading = false;
  let loaded = false;

  $("month").value = selectedMonth;

  function buildLocationCards() {
    $("locationCards").innerHTML = Object.entries(places)
      .map(([code, place]) => `
        <button
          type="button"
          class="location-card ${code}"
          data-location="${code}"
          aria-pressed="true"
        >
          <span class="location-card-head">
            <span class="location-name">
              ${esc(place.name)}
            </span>
            <span class="selection-mark" aria-hidden="true">✓</span>
          </span>

          <span class="location-address">
            ${esc(place.address)}
          </span>

          <span class="location-state" aria-hidden="true">
            已選取 · 點擊取消
          </span>
        </button>
      `).join("");
  }

  function updateLocationCards() {
    $("locationCards")
      .querySelectorAll("[data-location]")
      .forEach(button => {
        const selected = selectedLocations.has(
          button.dataset.location
        );

        button.setAttribute(
          "aria-pressed",
          String(selected)
        );

        button.querySelector(".location-state").textContent =
          selected
            ? "已選取 · 點擊取消"
            : "未選取 · 點擊顯示";
      });
  }

  function setStatus(text, error = false) {
    $("status").textContent = text;
    $("status").classList.toggle("error", error);
  }

  function updateControls() {
    const currentMonth = todayHK().slice(0, 7);

    $("month").min = currentMonth;
    $("month").max = "9999-12";

    $("previous").disabled =
      loading || selectedMonth <= currentMonth;

    $("next").disabled =
      loading || selectedMonth >= "9999-12";

    $("month").disabled = loading;
    $("thisMonth").disabled = loading;
    $("refresh").disabled = loading;

    $("schedule").setAttribute(
      "aria-busy",
      String(loading)
    );

    $("monthView").setAttribute(
      "aria-pressed",
      String(view === "month")
    );

    $("listView").setAttribute(
      "aria-pressed",
      String(view === "list")
    );
  }

  function timeHTML(event) {
    return `
      <div class="event-time">
        <time datetime="${esc(event.date)}T${esc(event.start_time)}:00+08:00">${esc(event.start_time)}</time>–<time datetime="${esc(event.date)}T${esc(event.end_time)}:00+08:00">${esc(event.end_time)}</time>
      </div>
    `;
  }

  function eventHTML(event, showAddress = false) {
    const place = places[event.location];

    if (showAddress) {
      return `
        <div class="event ${event.location}">
          <div class="agenda-event-head">
            <strong>${esc(place.name)}</strong>
            ${timeHTML(event)}
          </div>

          <div class="event-address">
            地址：${esc(place.address)}
          </div>
        </div>
      `;
    }

    return `
      <div class="event ${event.location}">
        <strong>${esc(place.name)}</strong>
        ${timeHTML(event)}
      </div>
    `;
  }

  function filteredEvents() {
    const today = todayHK();

    return events.filter(event =>
      event.date >= today &&
      event.date.slice(0, 7) === selectedMonth &&
      selectedLocations.has(event.location)
    );
  }

  function render() {
    updateControls();
    updateLocationCards();

    const [year, month] = selectedMonth.split("-").map(Number);

    $("monthTitle").textContent = `${year} 年 ${month} 月`;

    if (!loaded) {
      $("summary").textContent = "";
      $("calendarWrap").hidden = true;
      $("calendarHint").hidden = true;
      $("agenda").hidden = true;
      $("empty").hidden = false;

      $("calendar").replaceChildren();
      $("agenda").replaceChildren();

      $("empty").textContent = loading
        ? "正在讀取已確認駐診時間…"
        : "暫時未能取得日程，請按「重新整理」再試。";

      return;
    }

    const list = filteredEvents();
    const byDate = new Map();

    for (const event of list) {
      if (!byDate.has(event.date)) {
        byDate.set(event.date, []);
      }

      byDate.get(event.date).push(event);
    }

    $("summary").textContent =
      `${selectedLocations.size} / 4 個地點已選取 · ` +
      `${byDate.size} 個駐診日 · ${list.length} 節`;

    $("empty").hidden = list.length > 0;

    if (selectedLocations.size === 0) {
      $("empty").textContent =
        "目前未選取任何地點。請點擊上方地點方框，顯示相關駐診時間。";
    } else {
      $("empty").textContent =
        "所選地點本月暫未有可公開的已確認駐診時間。";
    }

    $("calendarWrap").hidden = view !== "month";
    $("calendarHint").hidden = view !== "month";
    $("agenda").hidden = view !== "list";

    renderCalendar(year, month, byDate);
    renderAgenda(byDate);
  }

  function renderCalendar(year, month, byDate) {
    const today = todayHK();

    const firstDay = new Date(
      Date.UTC(year, month - 1, 1)
    ).getUTCDay();

    const offset = (firstDay + 6) % 7;

    const lastDate = new Date(
      Date.UTC(year, month, 0)
    ).getUTCDate();

    let html = ["一", "二", "三", "四", "五", "六", "日"]
      .map(day =>
        `<div class="weekday">星期${day}</div>`
      ).join("");

    html += '<div aria-hidden="true"></div>'.repeat(offset);

    for (let day = 1; day <= lastDate; day++) {
      const date = `${year}-${pad(month)}-${pad(day)}`;

      const weekday = new Date(
        date + "T00:00:00Z"
      ).getUTCDay();

      const isToday = date === today;
      const weekend = weekday === 0 || weekday === 6;
      const items = byDate.get(date) || [];

      /*
        只按開始時間分類：
        12:59 或之前 → 上半部
        13:00 或之後 → 下半部

        上午開始、下午結束的更仍放上半部，
        不會拆開或重複顯示。
      */
      const morning = items.filter(
        event => event.start_time < "13:00"
      );

      const afternoon = items.filter(
        event => event.start_time >= "13:00"
      );

      html += `
        <div
          class="day
            ${weekend ? "weekend" : ""}
            ${date < today ? "past" : ""}
            ${isToday ? "today" : ""}"
          role="group"
          aria-label="${esc(date)}"
        >
          <div class="date-number">
            <strong>${day}</strong>
            ${isToday
              ? '<span class="today-label">今日</span>'
              : ""}
          </div>

          <div class="day-sessions">
            <div
              class="session-half morning"
              role="group"
              aria-label="13:00 前開始的更期"
            >
              ${morning.map(event => eventHTML(event)).join("")}
            </div>

            <div
              class="session-half afternoon"
              role="group"
              aria-label="13:00 或之後開始的更期"
            >
              ${afternoon.map(event => eventHTML(event)).join("")}
            </div>
          </div>
        </div>
      `;
    }

    $("calendar").innerHTML = html;
  }

  function renderAgenda(byDate) {
    const today = todayHK();

    $("agenda").innerHTML = [...byDate.entries()]
      .sort(([a], [b]) => a.localeCompare(b))
      .map(([date, items]) => {
        const weekday = new Date(
          date + "T00:00:00Z"
        ).getUTCDay();

        const [, month, day] = date.split("-").map(Number);

        return `
          <article class="agenda-day ${
            date === today ? "today" : ""
          }">
            <div class="agenda-date">
              <strong>${month} 月 ${day} 日</strong>
              <span>星期${weekdays[weekday]}</span>
              ${date === today
                ? '<span class="today-label">今日</span>'
                : ""}
            </div>

            ${items.map(event => eventHTML(event, true)).join("")}
          </article>
        `;
      }).join("");
  }

  async function load() {
    if (loading) return;

    const currentMonth = todayHK().slice(0, 7);

    if (selectedMonth < currentMonth) {
      selectedMonth = currentMonth;
      $("month").value = selectedMonth;
    }

    loading = true;
    loaded = false;
    events = [];

    render();
    setStatus("正在讀取已確認駐診時間…");

    const controller = new AbortController();

    const timeout = setTimeout(
      () => controller.abort(),
      15000
    );

    try {
      const response = await fetch(
        `${API}/rest/v1/rpc/ray_public_calendar`,
        {
          method: "POST",
          headers: {
            "apikey": KEY,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            p_month: selectedMonth
          }),
          credentials: "omit",
          cache: "no-store",
          signal: controller.signal
        }
      );

      if (!response.ok) {
        console.error(
          "Calendar API:",
          response.status,
          await response.text()
        );

        throw new Error("API_REQUEST_FAILED");
      }

      const result = await response.json();

      if (!Array.isArray(result)) {
        throw new Error("INVALID_RESPONSE");
      }

      const valid = result.every(event =>
        event &&
        typeof event === "object" &&
        validDate(event.date) &&
        Object.hasOwn(places, event.location) &&
        validTime(event.start_time) &&
        validTime(event.end_time) &&
        event.end_time > event.start_time &&
        event.date.slice(0, 7) === selectedMonth
      );

      if (!valid) {
        throw new Error("INVALID_EVENTS");
      }

      events = result.map(event => ({
        date: event.date,
        location: event.location,
        start_time: event.start_time,
        end_time: event.end_time
      })).sort((a, b) =>
        `${a.date} ${a.start_time} ${a.location}`.localeCompare(
          `${b.date} ${b.start_time} ${b.location}`
        )
      );

      loaded = true;

      const readAt = new Intl.DateTimeFormat("zh-HK", {
        timeZone: "Asia/Hong_Kong",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23"
      }).format(new Date());

      setStatus(
        `最後讀取：${readAt}（香港時間） · 頁面開啟時每分鐘更新`
      );
    } catch (error) {
      console.error(error);

      events = [];
      loaded = false;

      setStatus(
        error.name === "AbortError"
          ? "讀取逾時，請檢查網絡後重新整理。"
          : "暫時未能載入日程，請稍後按「重新整理」。",
        true
      );
    } finally {
      clearTimeout(timeout);
      loading = false;
      render();
    }
  }

  function chooseMonth(value) {
    if (loading) return;

    const currentMonth = todayHK().slice(0, 7);

    if (!validMonth(value) || value < currentMonth) {
      $("month").value = selectedMonth;
      setStatus("請選擇本月或之後的月份。", true);
      return;
    }

    selectedMonth = value;
    $("month").value = value;
    load();
  }

  function changeMonth(delta) {
    if (loading) return;

    const [year, month] = selectedMonth.split("-").map(Number);

    const date = new Date(
      Date.UTC(year, month - 1 + delta, 1)
    );

    chooseMonth(
      `${date.getUTCFullYear()}-${pad(date.getUTCMonth() + 1)}`
    );
  }

  $("locationCards").addEventListener("click", event => {
    const button = event.target.closest("[data-location]");

    if (!button) return;

    const code = button.dataset.location;

    if (!Object.hasOwn(places, code)) return;

    if (selectedLocations.has(code)) {
      selectedLocations.delete(code);
    } else {
      selectedLocations.add(code);
    }

    // 本地即時篩選，不需要重新讀取伺服器。
    render();
  });

  $("previous").addEventListener(
    "click",
    () => changeMonth(-1)
  );

  $("next").addEventListener(
    "click",
    () => changeMonth(1)
  );

  $("month").addEventListener(
    "change",
    () => chooseMonth($("month").value)
  );

  $("thisMonth").addEventListener(
    "click",
    () => chooseMonth(todayHK().slice(0, 7))
  );

  $("refresh").addEventListener("click", load);

  $("monthView").addEventListener("click", () => {
    view = "month";
    render();
  });

  $("listView").addEventListener("click", () => {
    view = "list";
    render();
  });

  setInterval(() => {
    if (!document.hidden && !loading) {
      load();
    }
  }, 60000);

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && !loading) {
      load();
    }
  });

  buildLocationCards();
  load();
})();
</script>
</body>
</html>
